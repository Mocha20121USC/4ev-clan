<script>

/* =========================================================
   4EV INTERACTIVE THERMOSTAT DIAL
   ========================================================= */

(() => {

    const dial =
        document.getElementById("dial-control");

    const percent =
        document.getElementById("loading-percent");

    const progress =
        document.getElementById("dial-progress");

    const statusFill =
        document.getElementById("status-fill");

    const statusText =
        document.getElementById("status-text");

    const message =
        document.getElementById("system-message");

    const loadingScreen =
        document.getElementById("loading-screen");

    if (!dial) return;


    let value = 0;

    let dragging = false;

    let lastAngle = null;

    let totalRotation = 0;

    let automaticProgress = true;


    const circumference = 2 * Math.PI * 112;


    /*
        SYSTEM MESSAGES
    */

    const messages = [

        [0, "4EV SYSTEMS INITIALIZING"],

        [18, "ESTABLISHING CONNECTION"],

        [38, "CALIBRATING NAVIGATION"],

        [58, "LOADING 4EV ENVIRONMENT"],

        [76, "ENTERING 4EV SPACE"],

        [92, "LANDING SEQUENCE READY"],

        [100, "4EV SYSTEMS ONLINE"]

    ];


    function updateMessage() {

        let current =
            messages[0][1];

        for (const item of messages) {

            if (value >= item[0]) {
                current = item[1];
            }

        }

        message.textContent =
            current;

    }


    function updateValue(newValue) {

        value =
            Math.max(
                0,
                Math.min(
                    100,
                    newValue
                )
            );

        percent.textContent =
            Math.floor(value);

        const offset =
            circumference -
            (value / 100) *
            circumference;

        progress.style.strokeDashoffset =
            offset;

        statusFill.style.width =
            value + "%";

        updateMessage();

        if (value < 25) {

            statusText.textContent =
                "INITIALIZING";

        } else if (value < 50) {

            statusText.textContent =
                "CONNECTING";

        } else if (value < 75) {

            statusText.textContent =
                "CALIBRATING";

        } else if (value < 100) {

            statusText.textContent =
                "ENTERING";

        } else {

            statusText.textContent =
                "ONLINE";

        }

    }


    /*
        GET ANGLE FROM MOUSE / TOUCH
    */

    function getAngle(event) {

        const rect =
            dial.getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        const point =
            event.touches
                ? event.touches[0]
                : event;

        return Math.atan2(
            point.clientY - centerY,
            point.clientX - centerX
        ) * 180 / Math.PI;

    }


    /*
        START DRAG
    */

    function startDrag(event) {

        event.preventDefault();

        dragging = true;

        automaticProgress = false;

        dial.classList.add(
            "dragging"
        );

        lastAngle =
            getAngle(event);

    }


    /*
        ROTATE
    */

    function rotateDial(event) {

        if (!dragging) return;

        event.preventDefault();

        const angle =
            getAngle(event);

        let difference =
            angle - lastAngle;

        /*
            Fix crossing from
            180 to -180.
        */

        if (difference > 180) {
            difference -= 360;
        }

        if (difference < -180) {
            difference += 360;
        }

        totalRotation +=
            difference;

        lastAngle =
            angle;

        /*
            Convert rotation
            into loading.
        */

        const newValue =
            value +
            difference * 0.45;

        updateValue(
            newValue
        );

        /*
            Small visual rotation
        */

        dial.style.setProperty(
            "--dial-rotation",
            totalRotation + "deg"
        );

    }


    /*
        END DRAG
    */

    function endDrag() {

        if (!dragging) return;

        dragging = false;

        dial.classList.remove(
            "dragging"
        );

        lastAngle = null;

        /*
            Continue automatically
            after the user lets go.
        */

        if (value < 100) {

            automaticProgress = true;

        }

    }


    /*
        MOUSE
    */

    dial.addEventListener(
        "mousedown",
        startDrag
    );

    window.addEventListener(
        "mousemove",
        rotateDial
    );

    window.addEventListener(
        "mouseup",
        endDrag
    );


    /*
        TOUCH
    */

    dial.addEventListener(
        "touchstart",
        startDrag,
        { passive: false }
    );

    window.addEventListener(
        "touchmove",
        rotateDial,
        { passive: false }
    );

    window.addEventListener(
        "touchend",
        endDrag
    );


    /*
        AUTOMATIC LOADING
    */

    let startTime =
        performance.now();

    const totalDuration =
        4800;


    function automaticLoading(now) {

        if (
            automaticProgress &&
            !dragging
        ) {

            const elapsed =
                now - startTime;

            const automatic =
                Math.min(
                    100,
                    elapsed /
                    totalDuration *
                    100
                );

            /*
                Smooth movement
            */

            const eased =
                1 -
                Math.pow(
                    1 - automatic / 100,
                    1.4
                );

            updateValue(
                Math.max(
                    value,
                    eased * 100
                )
            );

        }


        /*
            FINISH
        */

        if (
            value >= 100 &&
            !dragging
        ) {

            setTimeout(() => {

                loadingScreen
                    .classList
                    .add("finished");

                setTimeout(() => {

                    loadingScreen
                        .remove();

                }, 1200);

            }, 550);

            return;

        }


        requestAnimationFrame(
            automaticLoading
        );

    }


    /*
        START
    */

    updateValue(0);

    requestAnimationFrame(
        automaticLoading
    );

})();

</script>
